name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (parsing, geography, shrinkage, scoring, end to end)
        run: pytest
      - name: Rebuild the analysis from public data and the committed postcode cache
        run: |
          python scripts/ingest.py
          python run.py
